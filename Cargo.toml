[package]
name = "uxie"
version = "0.3.0"
edition = "2024"
description = "Data fetching library for Pokemon Gen 4 romhacking - map headers, C parsing, and more"
license = "MIT"
repository = "https://github.com/kalaay/uxie"
homepage = "https://github.com/KalaayPT/uxie"
documentation = "https://docs.rs/uxie"
readme = "README.md"
keywords = ["pokemon", "romhacking", "ds", "platinum", "heartgold"]
categories = ["parser-implementations", "game-development"]

[lib]
name = "uxie"
path = "src/lib.rs"

[[bin]]
name = "uxie"
path = "src/main.rs"

[dependencies]
bitflags = { version = "2.6", features = ["serde"] }
binrw = "0.14"
byteorder = "1.5"
modular-bitfield = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
chatot = "0.5.0"
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.11"
deunicode = "1.6"
rustc-hash = "2.1.0"
dashmap = "6.1.0"
rayon = "1.10.0"

[dev-dependencies]
tempfile = "3.14"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
