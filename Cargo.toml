[package]
name = "uxie"
version = "0.5.8"
edition = "2024"
description = "Data fetching library for Pokemon Gen 4 romhacking - map headers, C parsing, and more"
license = "MIT"
repository = "https://github.com/kalaay/uxie"
homepage = "https://github.com/KalaayPT/uxie"
documentation = "https://docs.rs/uxie"
readme = "README.md"
build = "build.rs"
include = [
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "src/**",
    "tests/**",
    "examples/**",
    "docs/**",
    "nitroarc/Makefile",
    "nitroarc/Makefile.devel",
    "nitroarc/COPYING",
    "nitroarc/COPYING.LESSER",
    "nitroarc/ffi/**",
    "nitroarc/lib/**",
    "nitroarc/src/**",
    "nitroarc/doc/**",
]
keywords = ["pokemon", "romhacking", "ds", "platinum", "heartgold"]
categories = ["parser-implementations", "game-development"]

[lib]
name = "uxie"
path = "src/lib.rs"

[[bin]]
name = "uxie"
path = "src/main.rs"

[dependencies]
bitflags = { version = "2.6", features = ["serde"] }
binrw = "0.14"
byteorder = "1.5"
modular-bitfield = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
chatot = "0.5.0"
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.11"
deunicode = "1.6"
rustc-hash = "2.1.0"
dashmap = "6.1.0"
rayon = "1.10.0"

[dev-dependencies]
tempfile = "3.14"
proptest = "1.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
# Enable pedantic and nursery lints at warn level
# Priority -1 ensures individual lint settings override group settings
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow specific lints that are too noisy or not applicable
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
use_self = "allow"
uninlined_format_args = "allow"
missing_const_for_fn = "allow"

# Binary parsing code requires many intentional casts between integer types
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"

# Documentation lints - too pedantic for internal code
doc_markdown = "allow"

# Common in ROM parsing with similar field names (script_id, script_file_id, etc.)
similar_names = "allow"

# Style preferences that add noise without much benefit
redundant_else = "allow"
match_bool = "allow"
items_after_statements = "allow"

# Result/Option method chains - the suggested alternatives are often less readable
map_unwrap_or = "allow"

# Collapsible if - often intentionally structured for clarity
collapsible_if = "allow"

# These are valid patterns that clippy is overly aggressive about
redundant_closure = "allow"
or_fun_call = "allow"

# Binary literals in ROM code often have semantic groupings that don't match clippy's expectations
unusual_byte_groupings = "allow"

# Passing small Copy types by value vs reference - let the compiler optimize
trivially_copy_pass_by_ref = "allow"
needless_pass_by_value = "allow"

# Redundant closures are sometimes clearer than point-free style
redundant_closure_for_method_calls = "allow"

# cloned vs copied - both work, not worth warning about
cloned_instead_of_copied = "allow"

# Match arms with identical bodies can be intentional for clarity
match_same_arms = "allow"

# Extension comparisons - we control the input data format
case_sensitive_file_extension_comparisons = "allow"
