[package]
name = "uxie"
version = "0.1.0"
edition = "2024"
description = "Data fetching library for Pokemon Gen 4 Romhacking - map headers, C parsing, and more"
license = "MIT"
repository = "https://github.com/kalaay/uxie"

[lib]
name = "uxie"
path = "src/lib.rs"

[[bin]]
name = "uxie"
path = "src/main.rs"

[dependencies]
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
regex = "1.11"

[dev-dependencies]
tempfile = "3.14"
